version: 1
scope: Fresh authored combinations; same catalog/families, not external blind evaluation
cases:
- id: new-original-usd-boundary
  split: acceptance
  category: fresh_constraint_combination
  description: New authored combination on the same seeded catalog and known task
    families, unrun and not human accepted.
  turns:
  - query: CascadePro钛合金折叠登山杖一对，送欧盟，标价最多148美元，按原币种，不含运税；没有合格款就明确说没有。
    oracle:
      candidate_ids:
      - P1010
      max_price: '148'
      country: EU
      currency: USD
    expectation:
      mode: no_match
      eligible_ids: []
