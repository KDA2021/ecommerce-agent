# Alembic configuration for ecommerce-agent (P11-2): MySQL schema versioning.
#
# NOTE: keep this file ASCII-only. Alembic reads it with the platform locale
# encoding (GBK on zh-CN Windows), so non-ASCII bytes here crash the CLI.
#
# The database URL is NOT really configured here: migrations/env.py overrides
# sqlalchemy.url at runtime with app.infrastructure.settings (DATABASE_URL), so
# CLI / scripts/migrate.py / integration tests all read the same source.
#
# Common commands:
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "describe change"
#   uv run python scripts/migrate.py            # project wrapper, upgrade head

[alembic]
# Migration script directory. %(here)s = the directory holding this ini file.
script_location = %(here)s/migrations

# Migration filename template: <date>_<rev>_<slug>.py, readable in git history.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Make `import app.*` work inside env.py (project root on sys.path).
prepend_sys_path = .

# Path separator follows the OS (";" on Windows, ":" on POSIX).
path_separator = os

# Placeholder URL only; migrations/env.py injects the real one at runtime.
# Keeping a value here lets the alembic CLI parse the [alembic] section.
sqlalchemy.url = mysql+asyncmy://ecommerce:ecommerce@localhost:3307/ecommerce?charset=utf8mb4


[post_write_hooks]

# Logging: quiet root, INFO for alembic itself.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
