# ecommerce-agent 前端 nginx 配置（P15-3）
#
# 一份 server 块同时干两件事：
#   1. 托管 Vite 构建产物（/usr/share/nginx/html），SPA 路由回落到 index.html；
#   2. 把 /api/* 反代到后端 app:8000，并**去掉 /api 前缀**。
#
# 第 2 条的「去前缀」与前端代码约定严格对齐：
#   - 前端所有请求都写 `/api/commerce/...`（frontend/src/api.ts、orderPreview.ts）；
#   - 后端路由本身没有 /api 前缀（app/presentation/routers/*.py 是 /commerce/...）；
#   - 开发环境由 Vite 的 server.proxy 做同一件事：rewrite 掉 ^/api（vite.config.ts）。
# 所以这里 location /api/ + proxy_pass http://app:8000/ 的尾斜杠必须保留，
# 它正是「/api/commerce/intents → /commerce/intents」的换算。

server {
    listen 80;
    server_name _;

    # ---------- 静态资源 ----------
    root /usr/share/nginx/html;
    index index.html;

    # 容器里没必要把 gzip 开得很激进：一个 200KB 的 JS + 少量文本就是全部产物。
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 构建产物带内容 hash（index-<hash>.js），可以放心长缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- API 反代 ----------

    # SSE 事件流（/commerce/events）单独放行：
    #   - proxy_buffering off：否则 nginx 会攒够一块才转发，事件就不是「实时」的了；
    #   - read_timeout 1h：会话窗口比普通请求长得多，默认 60s 会把流掐断；
    #   - HTTP/1.1 + Connection ""：与上游保持长连接，避免每条事件重新握手。
    location = /api/commerce/events {
        proxy_pass http://app:8000/commerce/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding off;
    }

    # 其余 /api/* → 后端同路径（去掉 /api 前缀）。
    # 尾斜杠不能省：location 前缀 /api/ 被替换成 /，这才是 Vite rewrite 的等价物。
    location /api/ {
        proxy_pass http://app:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agent 一轮最长可能跑到分钟级（精排 + planner + 子 Agent）。
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 没带尾斜杠的 /api 单独兜住，避免落进 SPA 回落返回一份 HTML。
    location = /api {
        return 404;
    }

    # ---------- SPA 回落 ----------
    # 前端在浏览器里用 history 路由（/dashboard 等），刷新时必须回 index.html，
    # 不能让 nginx 去磁盘上找 /dashboard 这个文件。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
