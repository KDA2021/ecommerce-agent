name: CI

# P15-1：CI 只跑「不需要真实外部依赖」的检查，保证在 fork / 无密钥环境下也能全绿：
#   - 不注入 LLM_API_KEY：所有 LLM 调用都被测试替身接管，缺 key 不会失败；
#   - 不起 MySQL service：tests 里 MySQL 集成用例统一 `pytest.mark.skipif(not
#     os.getenv("TEST_MYSQL_URL"))`，没有该变量时自动 skip（仍会跑单元 + 内存替身部分）。
# 想让 MySQL 集成用例也进 CI，取消下面 services 段的注释并把 job env 里的
# TEST_MYSQL_URL 打开即可，其余检查无需改动。

on:
  push:
    branches: [master, main, develop]
  pull_request:
  workflow_dispatch:

# 同一分支上新的 push 取消仍在跑的旧 run。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: /tmp/uv-cache
      # 测试在工作区内写 tmp / Chroma（默认 /tmp 在部分环境不可写，交给 runner 的
      # $RUNNER_TEMP 更稳）。
      HOME: ${{ github.workspace }}/.ci-home
      USERPROFILE: ${{ github.workspace }}/.ci-home
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
      # 可选：给 MySQL 集成用例用；留空则相关用例自动 skip（CI 不依赖数据库即可通过）。
      # TEST_MYSQL_URL: mysql+asyncmy://ecommerce:ecommerce@127.0.0.1:3306/ecommerce?charset=utf8mb4
    # 可选 MySQL service：
    # services:
    #   mysql:
    #     image: mysql:8.4
    #     env:
    #       MYSQL_ROOT_PASSWORD: root
    #       MYSQL_DATABASE: ecommerce
    #       MYSQL_USER: ecommerce
    #       MYSQL_PASSWORD: ecommerce
    #     ports: ["3306:3306"]
    #     options: >-
    #       --health-cmd "mysqladmin ping -h 127.0.0.1 -uecommerce -pecommerce"
    #       --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.x"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # --frozen：严格按 uv.lock 安装，lock 与 pyproject 不一致时报错而不是静默解析。
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run --no-sync ruff check app tests scripts migrations eval

      - name: Format check (changed Python files)
        # 只给新增 / 改动的文件把关：历史文件尚未纳入 ruff 格式化（见 pyproject.toml
        # [tool.ruff] 说明），全仓 `ruff format --check` 会产生上百个无关文件的 diff。
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-count=1 --skip=1 HEAD 2>/dev/null || true)"
          fi
          echo "diff base: ${base:-<none>}"
          if [ -n "$base" ]; then
            git -c core.quotepath=false diff --name-only --diff-filter=ACMR \
              "$base" HEAD -- '*.py' > "$RUNNER_TEMP/changed_py.txt" || true
          else
            : > "$RUNNER_TEMP/changed_py.txt"
          fi
          if [ ! -s "$RUNNER_TEMP/changed_py.txt" ]; then
            echo "no changed Python files; format check skipped"
            exit 0
          fi
          sed 's/^/  /' "$RUNNER_TEMP/changed_py.txt"
          xargs uv run --no-sync ruff format --check < "$RUNNER_TEMP/changed_py.txt"

      - name: Unit tests
        # -q：CI 日志更干净；本地同样命令见 `make test`。
        run: uv run --no-sync pytest -q

  frontend:
    name: frontend (npm build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: node --test "tests/*.test.mts"

      - name: Build
        run: npm run build
