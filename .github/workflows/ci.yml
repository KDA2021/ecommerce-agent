name: CI

# Fast checks stay independent of services. The isolated MySQL job must run
# real database cases with no skips and never receives an external model key.

on:
  push:
    branches: [master, main, develop]
  pull_request:
  workflow_dispatch:

# 同一分支上新的 push 取消仍在跑的旧 run。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: /tmp/uv-cache
      # 测试在工作区内写 tmp / Chroma（默认 /tmp 在部分环境不可写，交给 runner 的
      # $RUNNER_TEMP 更稳）。
      HOME: ${{ github.workspace }}/.ci-home
      USERPROFILE: ${{ github.workspace }}/.ci-home
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.x"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # --frozen：严格按 uv.lock 安装，lock 与 pyproject 不一致时报错而不是静默解析。
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run --no-sync ruff check app tests scripts migrations eval

      - name: Format check (changed Python files)
        # 只给新增 / 改动的文件把关：历史文件尚未纳入 ruff 格式化（见 pyproject.toml
        # [tool.ruff] 说明），全仓 `ruff format --check` 会产生上百个无关文件的 diff。
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-count=1 --skip=1 HEAD 2>/dev/null || true)"
          fi
          echo "diff base: ${base:-<none>}"
          if [ -n "$base" ]; then
            git -c core.quotepath=false diff --name-only --diff-filter=ACMR \
              "$base" HEAD -- '*.py' > "$RUNNER_TEMP/changed_py.txt" || true
          else
            : > "$RUNNER_TEMP/changed_py.txt"
          fi
          if [ ! -s "$RUNNER_TEMP/changed_py.txt" ]; then
            echo "no changed Python files; format check skipped"
            exit 0
          fi
          sed 's/^/  /' "$RUNNER_TEMP/changed_py.txt"
          xargs uv run --no-sync ruff format --check < "$RUNNER_TEMP/changed_py.txt"

      - name: Unit tests
        # -q：CI 日志更干净；本地同样命令见 `make test`。
        run: uv run --no-sync pytest -q

  mysql-integration:
    name: backend (real MySQL integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: ecommerce_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root-only"
          --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      UV_CACHE_DIR: /tmp/uv-cache
      # CI-only disposable service credentials. Migration tests create/drop an isolated DB.
      TEST_MYSQL_URL: mysql+asyncmy://root:ci-root-only@127.0.0.1:3306/ecommerce_ci?charset=utf8mb4
      TEST_MYSQL_ADMIN_URL: mysql+asyncmy://root:ci-root-only@127.0.0.1:3306/mysql?charset=utf8mb4
      LLM_API_KEY: ""
      RERANKER_ENABLED: "0"
      SEMANTIC_CACHE_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.x"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen
      - name: Real database tests
        run: >-
          uv run --no-sync pytest -q
          tests/test_mysql_repositories.py tests/test_migrations.py
          tests/test_checkpoint_handle.py tests/test_preference_store.py
          tests/test_order_transactions.py tests/test_session_ownership_mysql.py
          --junitxml=mysql-integration.xml
      - name: Reject skipped or empty integration suites
        if: always()
        run: uv run --no-sync python scripts/check_integration_results.py mysql-integration.xml
      - name: Upload database test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-integration-results
          path: mysql-integration.xml

  frontend:
    name: frontend (npm build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
