# ecommerce-agent 前端 dev overlay（P15-3）
#
# 默认 compose 栈跑**生产镜像**（nginx 托管 dist），适合验证真实部署形态。
# 需要 Vite dev server 的热更新时，把这个文件叠加在基础文件后面：
#
#   docker compose -f docker/docker-compose.yaml \
#                  -f docker/docker-compose.frontend-dev.yaml up -d
#   #   → 前端回到 http://localhost:5173（Vite，改动即时生效）
#
# 单独使用没有意义：这里只覆盖 frontend 服务，其余（mysql / redis / app）来自基础文件。

services:
  frontend:
    # 覆盖基础文件里的 build:，回到挂源码 + 跑 dev server 的开发形态。
    image: node:22-alpine
    build: !reset null
    container_name: ecommerce-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../frontend:/app
      # named volume 顶住容器内 node_modules，避免宿主（Windows）目录与
      # 容器（Linux）的二进制依赖互相覆盖。
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    # !reset 先把基础文件的 80:80 清掉，再只留 Vite 端口；
    # 否则 compose 会做列表合并，把生产镜像的 80 一起发布出去（指向 dev server，属于噪声）。
    ports: !override
      - "5173:5173"
    # 开发形态不沿用生产镜像的 80 端口探针。
    healthcheck: !reset null
    depends_on:
      - app

volumes:
  frontend-node-modules:
